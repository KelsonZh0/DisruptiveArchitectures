name: Reindexar assistente RAG

on:
  push:
    branches: [master, main]
    paths:
      - "material/**/*.md"
      - "material/**/*.ipynb"
      - "scripts/ingest.py"
      - "scripts/embed_with_workers_ai.py"
      - "scripts/build_vectorize_ndjson.py"
      - "scripts/load_chunks_oracle.py"
      - "scripts/prune_vectorize.py"
  workflow_dispatch:

concurrency:
  group: rag-reindex
  cancel-in-progress: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install requests oracledb

      - name: Extrair Markdown e notebooks em chunks
        working-directory: scripts
        run: |
          python ingest.py \
            --material-dir ../material \
            --base-url https://kelsonzh0.github.io/DisruptiveArchitectures \
            --output chunks.jsonl

      - name: Gerar embeddings via Workers AI
        working-directory: scripts
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python embed_with_workers_ai.py \
            --input chunks.jsonl \
            --output chunks_embedded.jsonl

      - name: Converter para o formato do Vectorize
        working-directory: scripts
        run: |
          python build_vectorize_ndjson.py \
            --input chunks_embedded.jsonl \
            --output vectors.ndjson

      - name: Sincronizar chunks no Oracle
        working-directory: scripts
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_SID: ${{ secrets.ORACLE_SID }}
          ORACLE_SERVICE_NAME: ${{ secrets.ORACLE_SERVICE_NAME }}
        run: |
          python load_chunks_oracle.py --input chunks.jsonl

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar wrangler
        run: npm install -g wrangler

      - name: Atualizar o índice no Vectorize
        working-directory: scripts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler vectorize upsert disruptive-architectures-index \
            --file=vectors.ndjson

      - name: Remover vetores que saíram do material
        working-directory: scripts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python prune_vectorize.py --input vectors.ndjson
